name: Refresh election snapshot
on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/civicapi.mjs'
      - 'scripts/refresh.mjs'
      - '.github/workflows/refresh.yml'
      - 'scripts/state-races.mjs'
      - 'scripts/refresh-states.mjs'
      - 'scripts/insights.mjs'
      - 'scripts/refresh-counties.mjs'
      - 'scripts/refresh-nc.py'
      - 'scripts/check-refresh-health.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: election-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start from latest published branch
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record refresh start
        run: echo "REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Fetch and validate source data
        id: fetch
        continue-on-error: true
        env:
          ELECTION_FEED_URL: ${{ vars.ELECTION_FEED_URL }}
        run: node scripts/refresh.mjs
      - name: Fetch governor and ballot-measure catalogues
        id: states
        continue-on-error: true
        run: node scripts/refresh-states.mjs
      - name: Fetch county results
        id: counties
        continue-on-error: true
        run: node scripts/refresh-counties.mjs
      - name: Fetch independent North Carolina results
        id: secondary
        continue-on-error: true
        run: python scripts/refresh-nc.py
      - name: Commit snapshot and health
        run: |
          git config user.name 'election-refresh[bot]'
          git config user.email 'election-refresh[bot]@users.noreply.github.com'
          git add Election_2026_Latest.json Election_2026_Status.md source-health.json Election_2026_Changes.json data/states data/counties data/secondary
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh sourced election snapshot and health'
            git pull --rebase origin main
            git push
          fi
      - name: Report refresh health
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          STATES_OUTCOME: ${{ steps.states.outcome }}
          COUNTIES_OUTCOME: ${{ steps.counties.outcome }}
          SECONDARY_OUTCOME: ${{ steps.secondary.outcome }}
        run: node scripts/check-refresh-health.mjs
